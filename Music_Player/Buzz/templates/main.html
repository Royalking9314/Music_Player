<html>
   <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>
      music player
    </title>
   </head>
   <body>
    
  <!-- Audio Visualizer Canvas Background -->
  <canvas id="visualizer-canvas"></canvas>

  <!-- Visualizer Controls -->
  <div class="visualizer-controls">
    <button id="toggle-visualizer" class="control-btn" title="Toggle Visualizer">
      <i class="fa fa-eye"></i>
    </button>
    <select id="visualizer-style" class="control-select">
      <option value="bars">Bars</option>
      <option value="circular">Circular</option>
      <option value="waveform">Waveform</option>
    </select>
  </div>
    
      <div class="music-player">
        {% for item in page_obj %}
       <div class="cover">
        <img alt="" src="{{item.image.url}}"/>
       </div>

       <div class="titre">
        <h3>
         {{item.artist}}
        </h3>
        <h1>
         {{item.title}}
        </h1>
       </div>
       
       <center>
         <a href="{% if page_obj.has_previous %}?page={{ page_obj.previous_page_number }}{% endif %}" title="Previous Page">
           <i class="fa fa-step-backward fa-2x"></i>
         </a>
         &nbsp; &nbsp; &nbsp;
         <a href="{% if page_obj.has_next %}?page={{ page_obj.next_page_number }} {% endif %}" title="Next Page">
           <i class="fa fa-step-forward fa-2x"></i>
         </a>
       </center>
       
       <div class="lecteur">
        <audio class="fc-media" id="fc-media" crossorigin="anonymous">
         <source src="{% if item.audio_file %}{{item.audio_file.url}} {% else %} {{item.audio_link}} {% endif %}" type="audio/mp3"/>
        </audio>
       </div>
      </div>     
    

    <div class="right-section">
      <!-- Synchronized Lyrics Container -->
      <div id="lyrics-display" class="lyrics-display">
        <div class="lyrics-line previous"></div>
        <div class="lyrics-line current"></div>
        <div class="lyrics-line next"></div>
      </div>
      
      <!-- Hidden data attribute for song ID -->
      <div id="song-data" data-song-id="{{item.id}}" style="display:none;"></div>
    </div>
    
    
    {% endfor %}
.
   </body>
  </html>
