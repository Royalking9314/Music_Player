services:
  - type: web
    name: music-player
    runtime: python
    buildCommand: |
      cd Music_Player && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd Music_Player && gunicorn Music_Player.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: music-player-db
          property: connectionString

databases:
  - name: music-player-db
    plan: free
